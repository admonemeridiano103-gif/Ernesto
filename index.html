html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 6px;border-bottom:1px solid var(--bd)}

.sbox{position:relative}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}

.tab{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;position:relative}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}

.chip{flex:0 0 auto;height:34px;padding:0 12px;border-radius:9px;background:var(--card2);font-size:13px;font-weight:600;color:var(--mu)}

.meta{font-size:12px;color:var(--mu);padding:8px 14px 0}
main{padding:8px 10px 20px}
.cont{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:10px 0;overflow:hidden}
.cont .cont{box-shadow:none;border:1px solid var(--bd);margin:8px 8px 10px}

.cont-h .em{font-size:20px}
.cont-h .t{flex:1;font-weight:700;font-size:15px}
.cont-h .t small{display:block;font-weight:500;color:var(--mu);font-size:12px}
.bdg{min-width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;background:var(--card2);color:var(--mu)}
.bdg.wa{background:var(--waS);color:var(--wa)}.bdg.ba{background:var(--baS);color:var(--ba)}
.addin{width:40px;height:40px;border-radius:10px;font-size:22px;color:var(--pr);background:var(--prS)}
.chev{width:22px;color:var(--mu);transition:transform .18s}
.cont.col>.cont-h .chev{transform:rotate(-90deg)}
.cont.col>.cont-b{display:none}
.cont-b{border-top:1px solid var(--bd)}
.empty{padding:14px;color:var(--mu);font-size:14px}
.it{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--bd);border-left:4px solid transparent;min-height:58px}
.it:last-child{border-bottom:0}
.it.wa{border-left-color:var(--wa);background:linear-gradient(90deg,var(--waS),transparent 60%)}
.it.ba{border-left-color:var(--ba);background:linear-gradient(90deg,var(--baS),transparent 60%)}
.it-main{flex:1;text-align:left;min-width:0;padding:6px 0}
.it-name{display:block;font-size:15px;font-weight:600;line-height:1.25}

.it-sub{display:block;font-size:12px;color:var(--mu);margin-top:2px}

.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--mu);margin-right:4px;vertical-align:1px}
.tag.c{background:var(--prS);color:var(--pr)}
.tag.u{background:var(--waS);color:var(--wa)}
.ctrl{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.qb{width:46px;height:46px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:600;line-height:1}
.qb:active{transform:scale(.94)}
.qb.plus{background:var(--prS);color:var(--pr)}
.qty{min-width:48px;text-align:center;font-weight:800;font-size:18px;padding:4px 6px;border-radius:10px;background:var(--okS);color:var(--ok)}
.qty small{display:block;font-size:10px;font-weight:600;opacity:.85}
.qty.wa{background:var(--waS);color:var(--wa)}.qty.ba{background:var(--baS);color:var(--ba)}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:5px}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:0 12px;font-size:16px;outline:none}

.inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prS)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}

.step .qb{flex:0 0 52px;height:48px}
.row2{display:flex;gap:10px}.row2>*{flex:1}

.nav button.on{color:var(--pr)}
.nav .add{flex:0 0 72px}
.nav .add span.c{width:52px;height:52px;border-radius:16px;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:400;box-shadow:0 4px 12px rgba(31,111,235,.35)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:8px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}

.shopen .toast{bottom:auto;top:calc(10px + env(safe-area-inset-top))}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast.wa{background:#8a4b05}.toast.ba{background:#9b1c1c}
.toast span{flex:1}

.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:60;background:var(--pr);color:#fff;border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(-140%);transition:transform .25s}
.upd.show{transform:none}.upd span{flex:1}
.upd button{height:36px;padding:0 14px;border-radius:9px;background:#fff;color:var(--pr);font-weight:800;font-size:13px}
.nav .nb.dot{min-width:10px;width:10px;height:10px;padding:0;top:8px;left:calc(50% + 10px);background:var(--wa)}
.ok-line{color:var(--ok);font-weight:700}.wa-line{color:var(--wa);font-weight:700}
ol.how{margin:6px 0 4px;padding-left:20px;color:var(--mu);font-size:14px}ol.how li{margin:4px 0}
.hide{display:none!important}
@media (min-width:760px){main,.hdr>.in{max-width:760px;margin:0 auto}.sheet{max-width:620px;margin:0 auto}.toast{max-width:520px;margin:0 auto}}

/* ---------- Estado en memoria ---------- */
const S={items:[],conts:[],movs:[],meta:{},view:'inv',nivel:'Entrepaño 1',filtro:'todos',q:'',col:{},alta:null,persisted:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=n=>Number.isInteger(n)?String(n):(+n).toFixed(2).replace(/\.?0+$/,'');
const ckey=(nivel,nombre)=>nivel+'¦'+nombre;
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- Normalización y búsqueda ---------- */
function n1(c){const n=c.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();return n.length===1?n:(n[0]||' ')}
function norm(s){s=String(s||'');let o='';for(let i=0;i<s.length;i++)o+=n1(s[i]);return o} // misma longitud que el original → permite resaltar
const words=s=>s.split(/[^a-z0-9ñ]+/).filter(w=>w.length>=3);
// ¿distancia de edición ≤ 1? (O(n), sin matrices → búsqueda tolerante a errores en < 1 ms)
function within1(a,b){const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let i=0,j=0,e=0;
  while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}
  return e+(la-i)+(lb-j)<=1}
function fuzzy(t,ws){const L=t.length;for(const w of ws){for(const k of [L-1,L,L+1]){if(k<3)continue;if(within1(t,w.slice(0,k)))return true}}return false}

/* ---------- Lógica de negocio ---------- */
function estado(it){if(it.cantidad<=0)return 'Agotado';if(it.categoria==='consumible'&&it.cantidad<=it.stock_minimo)return 'Por agotarse';return 'OK'}
const STC={'OK':'ok','Por agotarse':'wa','Agotado':'ba'};
let CIDX=new Map();
function reindexConts(){CIDX=new Map(S.conts.map(c=>[ckey(c.nivel,c.nombre),c]))}
function contOf(it){return CIDX.get(ckey(it.nivel,it.contenedor))}
function prep(it){
  it.estado_stock=estado(it);
  const c=contOf(it),padre=c&&c.padre?c.padre:'';
  it._n=norm(it.nombre);
  it._l=norm(`${it.nivel} ${CORTO[it.nivel]} ${padre} ${it.contenedor} ${it.notas||''} ${it.categoria} ${it.unidad}`);
  it._w=words(it._n);it._lw=words(it._l);
  return it;
}
function clean(it){const o={};for(const k in it)if(k[0]!=='_')o[k]=it[k];return o}
function mkItem(o){const now=Date.now();return prep({id:uid(),nombre:o.nombre.trim(),categoria:o.categoria,nivel:o.nivel,contenedor:o.contenedor,cantidad:+o.cantidad||0,stock_minimo:+o.stock_minimo||0,unidad:o.unidad||'Pza',estado_stock:'OK',notas:o.notas||'',en_uso:false,en_lista:false,creado:now,actualizado:now})}
function needsBuy(it){return it.estado_stock!=='OK'||it.en_lista}
function sugerido(it){if(it.categoria!=='consumible')return Math.max(1,1-it.cantidad);const obj=Math.max(it.stock_minimo*2,it.stock_minimo+1,1);return Math.max(1,obj-it.cantidad)}
const byId=id=>S.items.find(i=>i.id===id);

function buildSeed(){
  const conts=[],items=[];let cur=null;
  NIVELES.forEach((n,i)=>conts.push({id:uid(),nivel:n,nombre:'Suelto',tipo:'Suelto',padre:null,orden:900+i}));
  SEED.trim().split('\n').forEach(raw=>{
    const l=raw.trim();if(!l)return;
    if(l[0]==='#'){const [nv,nombre,tipo,padre]=l.slice(1).split('|');cur={id:uid(),nivel:NMAP[nv],nombre,tipo,padre:padre||null,orden:conts.length};conts.push(cur);return}
    const [q,nombre,c,u,m,notas]=l.split('|');const cat=c==='C'?'consumible':'herramienta';
    items.push({nombre,categoria:cat,nivel:cur.nivel,contenedor:cur.nombre,cantidad:+q,stock_minimo:cat==='consumible'?(m!==undefined&&m!==''?+m:0):0,unidad:u||'Pza',notas:notas||''});
  });
  return {conts,items};
}

/* ---------- Persistencia: IndexedDB con respaldo en localStorage ---------- */
const DB={db:null,mode:'idb',
  open(){return new Promise(res=>{
    let done=false;const fb=()=>{if(done)return;done=true;this.mode='ls';res()};
    try{
      if(!window.indexedDB)return fb();
      const r=indexedDB.open('closet_inventario',1);
      r.onupgradeneeded=()=>{const d=r.result;[['items','id'],['conts','id'],['movs','id'],['meta','k']].forEach(([s,k])=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:k})})};
      r.onsuccess=()=>{if(done)return;done=true;this.db=r.result;res()};
      r.onerror=fb;r.onblocked=fb;setTimeout(fb,2500);
    }catch(e){fb()}
  })},
  all(st){if(this.mode==='ls')return Promise.resolve(lsGet('ci_'+st,st==='meta'?[]:[]));
    return new Promise((res,rej)=>{const q=this.db.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  _ls(st){const src={items:S.items.map(clean),conts:S.conts,movs:S.movs,meta:Object.entries(S.meta).map(([k,v])=>({k,v}))}[st];lsSet('ci_'+st,src)},
  tx(st,fn){if(this.mode==='ls'){this._ls(st);return Promise.resolve()}
    return new Promise((res,rej)=>{const t=this.db.transaction(st,'readwrite');const os=t.objectStore(st);fn(os);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}).catch(e=>{toast('No se pudo guardar: '+(e&&e.message||e),null,'ba')})},
  put(st,objs){objs=[].concat(objs);return this.tx(st,os=>objs.forEach(o=>os.put(st==='items'?clean(o):o)))},
  del(st,id){return this.tx(st,os=>os.delete(id))},
  clear(st){return this.tx(st,os=>os.clear())}
};
const saveItem=it=>DB.put('items',it);
const setMeta=(k,v)=>{S.meta[k]=v;return DB.put('meta',{k,v})};
function logMov(it,tipo,delta,extra){const m={id:uid(),ts:Date.now(),itemId:it.id,nombre:it.nombre,nivel:it.nivel,contenedor:it.contenedor,tipo,delta,final:it.cantidad,...(extra||{})};S.movs.push(m);if(S.movs.length>1500){const old=S.movs.splice(0,S.movs.length-1500);DB.tx('movs',os=>old.forEach(o=>os.delete(o.id)))}DB.put('movs',m);return m}

async function load(){
  await DB.open();
  const [items,conts,movs,meta]=await Promise.all(['items','conts','movs','meta'].map(s=>DB.all(s).catch(()=>[])));
  S.meta=Object.fromEntries((meta||[]).map(m=>[m.k,m.v]));
  if(!S.meta.seeded&&!(items||[]).length){await seedAll()}
  else{S.conts=conts||[];reindexConts();S.items=(items||[]).map(prep);S.movs=(movs||[]).sort((a,b)=>a.ts-b.ts)}
  S.col=lsGet('ci_col',{});
  const ui=lsGet('ci_ui',{});if(NIVELES.includes(ui.nivel))S.nivel=ui.nivel;
  try{if(navigator.storage&&navigator.storage.persist)S.persisted=await navigator.storage.persist()}catch(e){}
}
async function seedAll(){
  const sd=buildSeed();S.conts=sd.conts;reindexConts();S.items=sd.items.map(mkItem);S.movs=[];
  await DB.clear('items');await DB.clear('conts');await DB.clear('movs');
  await DB.put('conts',S.conts);await DB.put('items',S.items);await setMeta('seeded',SEED_VERSION);
}

/* ---------- Renderizado ---------- */
function stats(){let rep=0,ba=0;for(const it of S.items){if(needsBuy(it))rep++;if(it.estado_stock==='Agotado')ba++}return {rep,ba}}
function badges(){
  const {rep}=stats();const nb=$('#nb');nb.textContent=rep;nb.classList.toggle('hide',!rep);
  $('#hstat').textContent=`${S.items.length} artículos`;
  $('#nbBk').classList.toggle('hide',!backupDue().due);
}
function backupDue(){const lb=S.meta.lastBackup||0;const pend=S.movs.filter(m=>m.ts>lb);const first=pend[0];return {n:pend.length,lb,due:pend.length>=10||(!!first&&Date.now()-first.ts>7*864e5)}}
function locTxt(it){const c=contOf(it);return `${CORTO[it.nivel]} › ${c&&c.padre?esc(c.padre)+' › ':''}${esc(it.contenedor)}`}
function hl(it,toks){
  if(!toks||!toks.length)return esc(it.nombre);
  const r=[];for(const t of toks){let i=it._n.indexOf(t);while(i>=0){r.push([i,i+t.length]);i=it._n.indexOf(t,i+t.length)}}
  if(!r.length)return esc(it.nombre);
  r.sort((a,b)=>a[0]-b[0]);const m=[r[0].slice()];for(const x of r.slice(1)){const l=m[m.length-1];if(x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push(x.slice())}
  let o='',p=0;for(const [a,b] of m){o+=esc(it.nombre.slice(p,a))+'<mark>'+esc(it.nombre.slice(a,b))+'</mark>';p=b}return o+esc(it.nombre.slice(p));
}
function rowHtml(it,ctx,toks){
  const st=STC[it.estado_stock],cons=it.categoria==='consumible';
  let sub='';
  if(ctx==='s')sub+=locTxt(it)+' · ';
  sub+=`<span class="tag ${cons?'c':''}">${cons?'Consumible':'Herramienta'}</span>`;
  if(it.en_uso)sub+='<span class="tag u">En uso</span>';
  if(it.estado_stock==='Agotado')sub+='<span class="bad">⛔ Agotado</span>';
  else if(it.estado_stock==='Por agotarse')sub+=`<span class="warn">⚠️ Reponer</span> · mín ${fmt(it.stock_minimo)}`;
  else if(cons&&it.stock_minimo>0)sub+=`mín ${fmt(it.stock_minimo)}`;
  if(it.en_lista&&it.estado_stock==='OK')sub+=' · 🛒 en lista';
  if(it.notas)sub+=' · '+esc(it.notas);
  const q=`<span class="qty ${cons?st:(st==='ba'?'ba':'h')}">${fmt(it.cantidad)}<small>${esc(it.unidad)}</small></span>`;
  const ctrl=cons?`<button class="qb" data-act="dec" aria-label="Consumir 1">−</button>${q}<button class="qb plus" data-act="inc" aria-label="Agregar 1">+</button>`:q;
  return `<div class="it ${cons||st==='ba'?st:''}" data-id="${it.id}" data-ctx="${ctx}"><button class="it-main" data-act="edit"><span class="it-name">${hl(it,toks)}</span><span class="it-sub">${sub}</span></button><div class="ctrl">${ctrl}</div></div>`;
}
function passFiltro(it){switch(S.filtro){case 'herr':return it.categoria==='herramienta';case 'cons':return it.categoria==='consumible';case 'rep':return needsBuy(it);case 'uso':return it.en_uso;default:return true}}
const byName=(a,b)=>a.nombre.localeCompare(b.nombre,'es',{numeric:true});
function itemsIn(c){return S.items.filter(it=>it.nivel===c.nivel&&it.contenedor===c.nombre)}

function subbar(){
  const sb=$('#subbar');
  if(S.view!=='inv'){sb.innerHTML='';return}
  const chips=`<div class="chips">${FILTROS.map(([k,l])=>`<button class="chip ${S.filtro===k?'on':''}" data-filtro="${k}">${l}</button>`).join('')}</div>`;
  if(S.q.trim()){sb.innerHTML=chips;return}
  const tabs=NIVELES.map(n=>{const its=S.items.filter(i=>i.nivel===n);const ba=its.some(i=>i.estado_stock==='Agotado'),wa=its.some(i=>i.estado_stock==='Por agotarse');
    return `<button class="tab ${S.nivel===n?'on':''}" data-nivel="${n}">${n==='Piso'?'Piso':'Entrepaño '+n.slice(-1)} <span class="n">${its.length}</span>${ba?'<span class="dot ba"></span>':wa?'<span class="dot"></span>':''}</button>`}).join('');
  sb.innerHTML=`<div class="tabs" id="tabs">${tabs}</div>${chips}`;
  const on=sb.querySelector('.tab.on');if(on)on.scrollIntoView({block:'nearest',inline:'center'});
}
function contHtml(c){
  const all=itemsIn(c),its=all.filter(passFiltro).sort(byName);
  const kids=S.conts.filter(k=>k.nivel===c.nivel&&k.padre===c.nombre).sort((a,b)=>a.orden-b.orden).map(contHtml).join('');
  if(S.filtro!=='todos'&&!its.length&&!kids)return '';
  const ba=all.filter(i=>i.estado_stock==='Agotado').length,wa=all.filter(i=>i.estado_stock==='Por agotarse').length;
  const k=c.id,col=S.filtro==='todos'&&S.col[k];
  return `<section class="cont ${col?'col':''}" data-cid="${k}"><button class="cont-h" data-act="toggle"><span class="em">${TIPOS[c.tipo]||'📦'}</span><span class="t">${esc(c.nombre)}<small>${c.tipo}${c.padre?' dentro de '+esc(c.padre):''} · ${all.length} artículo${all.length===1?'':'s'}</small></span>${ba?`<span class="bdg ba">${ba}</span>`:''}${wa?`<span class="bdg wa">${wa}</span>`:''}<span class="addin" data-act="addin" role="button" aria-label="Agregar aquí" style="display:flex;align-items:center;justify-content:center">+</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="cont-b">${its.map(i=>rowHtml(i,'c')).join('')}${!all.length?'<div class="empty">Vacío. Toca <b>+</b> para agregar artículos aquí.</div>':''}${kids}</div></section>`;
}
function renderInv(){
  const v=$('#view'),meta=$('#meta');
  if(S.q.trim())return renderSearch();
  meta.classList.add('hide');
  const top=S.conts.filter(c=>c.nivel===S.nivel&&!c.padre).sort((a,b)=>a.orden-b.orden);
  let h=top.map(contHtml).join('');
  if(!h)h=`<div class="card"><p>No hay artículos con el filtro <b>${FILTROS.find(f=>f[0]===S.filtro)[1]}</b> en ${S.nivel}.</p></div>`;
  h+=`<button class="btn" data-act="newcont" style="margin-top:12px">＋ Nuevo contenedor en ${S.nivel}</button>`;
  v.innerHTML=h;
}
function renderSearch(){
  const t0=performance.now();
  const toks=norm(S.q).split(/\s+/).filter(Boolean);
  const res=[];
  for(const it of S.items){
    if(!passFiltro(it))continue;
    let sc=0;
    for(const t of toks){
      const i=it._n.indexOf(t);
      if(i>=0){sc+=10+(i===0||!/[a-z0-9]/.test(it._n[i-1])?5:0)}
      else if(it._l.includes(t))sc+=4;
      else if(t.length>=4&&fuzzy(t,it._w))sc+=3;
      else if(t.length>=4&&fuzzy(t,it._lw))sc+=1;
      else{sc=-1;break}
    }
    if(sc>0)res.push([sc,it]);
  }
  // agrupar por ubicación, ordenar grupos por mejor puntuación
  const g=new Map();
  for(const [sc,it] of res){const k=ckey(it.nivel,it.contenedor);if(!g.has(k))g.set(k,{best:0,its:[],it});const o=g.get(k);o.best=Math.max(o.best,sc);o.its.push([sc,it])}
  const grupos=[...g.values()].sort((a,b)=>b.best-a.best||NIVELES.indexOf(a.it.nivel)-NIVELES.indexOf(b.it.nivel));
  let h='';
  for(const gr of grupos){gr.its.sort((a,b)=>b[0]-a[0]||byName(a[1],b[1]));
    const c=contOf(gr.it);
    h+=`<div class="grp">${esc(gr.it.nivel)} › ${c&&c.padre?esc(c.padre)+' › ':''}${esc(gr.it.contenedor)} (${gr.its.length})</div><div class="cont">${gr.its.map(([,it])=>rowHtml(it,'c',toks)).join('')}</div>`}
  if(!res.length)h=`<div class="card"><p>Sin resultados para “${esc(S.q)}”.</p><button class="btn pr" data-act="altaq">＋ Dar de alta “${esc(S.q.trim())}”</button></div>`;
  $('#view').innerHTML=h;
  const ms=performance.now()-t0;const meta=$('#meta');meta.classList.remove('hide');
  meta.textContent=`${res.length} resultado${res.length===1?'':'s'} en ${grupos.length} ${grupos.length===1?'ubicación':'ubicaciones'} · ${ms<1?ms.toFixed(2):ms.toFixed(1)} ms`;
}

function listaTexto(){
  const L=S.items.filter(needsBuy);const d=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});

  const A=L.filter(i=>i.estado_stock==='Agotado'),W=L.filter(i=>i.estado_stock==='Por agotarse'),M=L.filter(i=>i.estado_stock==='OK');
  let t=`🛒 *Lista de compras – Clóset*\n${d}\n`;
  if(A.length)t+=`\n🔴 *AGOTADO*\n${A.map(line).join('\n')}\n`;

function readForm(p){

function wireForm(p,root,onNewCont){
  root.querySelectorAll(`#${p}cat,#${p}nivel,#${p}unidad`).forEach(grp=>grp.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;grp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(grp.id===p+'cat')document.getElementById(p+'minw').classList.toggle('hide',b.dataset.v!=='consumible');
    if(grp.id===p+'nivel'){document.getElementById(p+'cont').innerHTML=contOptions(b.dataset.v,'')}
    if(grp.id===p+'unidad')document.getElementById(p+'cantidad').setAttribute('inputmode',b.dataset.v==='Metros'?'decimal':'numeric');}));
  const sel=document.getElementById(p+'cont');sel.dataset.prev=sel.value;

    if(sel.value!=='__new'){sel.dataset.prev=sel.value;return}
    sel.value=sel.dataset.prev||'';const nivel=root.querySelector(`#${p}nivel .on`).dataset.v;

    contEditor(null,nivel,c=>onNewCont(Object.assign(draft,{nivel:c.nivel,contenedor:c.nombre})),{nested:p==='e_',onCancel:()=>onNewCont(draft)});

}

function exportJSON(){
  const data={app:'closet-inventario',version:1,exportado:new Date().toISOString(),contenedores:S.conts,items:S.items.map(clean),movimientos:S.movs};
  const d=new Date(),f=`respaldo_closet_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  download(f,JSON.stringify(data,null,1),'application/json');setMeta('lastBackup',Date.now());toast('Respaldo descargado: '+f);if(S.view==='mas')renderMas();

function download(name,text,type){const b=new Blob([text],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function importJSON(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast('El archivo no es un JSON válido',null,'ba');return}
  const items=Array.isArray(data)?data:data.items;
  if(!Array.isArray(items)||!items.every(i=>i&&i.nombre&&NIVELES.includes(i.nivel))){toast('El respaldo no tiene el formato esperado',null,'ba');return}
  confirmSheet('Cargar respaldo',`Se reemplazará el inventario actual (${S.items.length} artículos) por el del respaldo (${items.length} artículos). ¿Continuar?`,'Reemplazar',async()=>{
    const conts=Array.isArray(data.contenedores)?data.contenedores.filter(c=>c&&c.nombre&&NIVELES.includes(c.nivel)):[];
    S.conts=conts.map((c,i)=>({id:c.id||uid(),nivel:c.nivel,nombre:c.nombre,tipo:TIPOS[c.tipo]?c.tipo:'Caja',padre:c.padre||null,orden:c.orden??i}));reindexConts();
    for(const it of items){const k=ckey(it.nivel,it.contenedor||'Suelto');if(!CIDX.has(k)){const c={id:uid(),nivel:it.nivel,nombre:it.contenedor||'Suelto',tipo:'Caja',padre:null,orden:S.conts.length};S.conts.push(c);CIDX.set(k,c)}}
    S.items=items.map(o=>prep({id:o.id||uid(),nombre:String(o.nombre),categoria:o.categoria==='consumible'?'consumible':'herramienta',nivel:o.nivel,contenedor:o.contenedor||'Suelto',cantidad:+o.cantidad||0,stock_minimo:+o.stock_minimo||0,unidad:UNIDADES.includes(o.unidad)?o.unidad:'Pza',estado_stock:'OK',notas:o.notas||'',en_uso:!!o.en_uso,en_lista:!!o.en_lista,creado:o.creado||Date.now(),actualizado:o.actualizado||Date.now()}));
    S.movs=Array.isArray(data.movimientos)?data.movimientos.filter(m=>m&&m.id&&m.ts):[];
    await DB.clear('items');await DB.clear('conts');await DB.clear('movs');await DB.put('conts',S.conts);await DB.put('items',S.items);await DB.put('movs',S.movs);await setMeta('seeded',SEED_VERSION);
    toast(`Respaldo cargado: ${S.items.length} artículos`);badges();render();
  });
}

  $('#c_no').onclick=()=>{if(nested&&onCancel)onCancel();else closeSheet()};
  if(c)$('#c_del').onclick=()=>{const n=itemsIn(c).length,k=S.conts.some(x=>x.nivel===c.nivel&&x.padre===c.nombre);if(n||k){toast(`No se puede: tiene ${n} artículo(s)${k?' y contenedores dentro':''}. Muévelos primero.`,null,'wa');return}
    confirmSheet('Eliminar contenedor',`¿Eliminar “${c.nombre}”?`,'Eliminar',()=>{S.conts=S.conts.filter(x=>x!==c);reindexConts();DB.del('conts',c.id);refresh();toast('Contenedor eliminado')})};
  $('#c_save').onclick=()=>{
    const nombre=$('#c_nombre').value.trim(),tipo=root.querySelector('#c_tipo .on').dataset.v,niv=root.querySelector('#c_nivel .on').dataset.v,padre=$('#c_padre').value||null;
    if(!nombre){toast('Escribe el nombre del contenedor',null,'wa');return}
    if(S.conts.some(x=>x!==c&&x.nivel===niv&&x.nombre.toLowerCase()===nombre.toLowerCase())){toast('Ya existe un contenedor con ese nombre en '+niv,null,'wa');return}
    let out;
    if(c){const oldN=c.nombre,oldV=c.nivel,now=Date.now();
      const own=S.items.filter(i=>i.nivel===oldV&&i.contenedor===oldN);
      const kids=S.conts.filter(x=>x.nivel===oldV&&x.padre===oldN);
      const kidItems=kids.flatMap(k=>S.items.filter(i=>i.nivel===oldV&&i.contenedor===k.nombre));
      Object.assign(c,{nombre,tipo,nivel:niv,padre});kids.forEach(k=>{k.padre=nombre;k.nivel=niv});
      own.forEach(i=>{i.contenedor=nombre;i.nivel=niv;i.actualizado=now});kidItems.forEach(i=>{i.nivel=niv;i.actualizado=now});
      reindexConts();const ch=[...own,...kidItems];ch.forEach(prep);DB.put('conts',[c,...kids]);if(ch.length)DB.put('items',ch);out=c;
    }else{out={id:uid(),nivel:niv,nombre,tipo,padre,orden:S.conts.length};S.conts.push(out);reindexConts();DB.put('conts',out)}
    toast(c?'Contenedor actualizado':`Contenedor creado en ${niv}`);
    if(nested&&after){after(out);return}
    closeSheet();if(after)after(out);else refresh();
  };
}

/* ---------- Acciones rápidas (1 toque, sin formularios) ---------- */
let tTimer=null,undoFn=null;
function toast(msg,undo,kind){const t=$('#toast');$('#toastTx').textContent=msg;t.className='toast show'+(kind?' '+kind:'');undoFn=undo||null;$('#toastBtn').classList.toggle('hide',!undo);clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),undo?4500:2600)}
$('#toastBtn').addEventListener('click',()=>{if(undoFn)undoFn();undoFn=null;$('#toast').classList.remove('show')});
function bump(id,d){
  const it=byId(id);if(!it)return;const prev=it.cantidad,prevSt=it.estado_stock;
  const nq=Math.max(0,+(prev+d).toFixed(3));if(nq===prev){toast(`${it.nombre} ya está en 0`,null,'ba');return}
  it.cantidad=nq;it.actualizado=Date.now();prep(it);saveItem(it);
  const m=logMov(it,d>0?'reposicion':'consumo',nq-prev);
  updateRows(it);badges();
  if(navigator.vibrate)navigator.vibrate(it.estado_stock!=='OK'&&prevSt==='OK'?[30,40,30]:12);
  const undo=()=>{it.cantidad=prev;it.actualizado=Date.now();prep(it);saveItem(it);S.movs=S.movs.filter(x=>x!==m);DB.del('movs',m.id);updateRows(it);badges();if(S.view==='rep')renderRep()};
  const kind=it.estado_stock==='Agotado'?'ba':it.estado_stock==='Por agotarse'?'wa':'';
  const pre=it.estado_stock==='Agotado'?'⛔ Agotado · ':it.estado_stock==='Por agotarse'?'⚠️ Reponer · ':'';
  toast(`${pre}${d>0?'+1':'−1'} ${it.nombre} → ${fmt(nq)} ${it.unidad}`,undo,kind);
}
function updateRows(it){document.querySelectorAll(`.it[data-id="${it.id}"][data-ctx]`).forEach(el=>{const toks=S.q.trim()?norm(S.q).split(/\s+/).filter(Boolean):null;el.outerHTML=rowHtml(it,el.dataset.ctx,toks)})}

/* ---------- Navegación y eventos ---------- */
function render(){subbar();({inv:renderInv,rep:renderRep,alta:renderAlta,mas:renderMas}[S.view])();badges()}
function refresh(){render()}
function go(v){S.view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));window.scrollTo(0,0);render()}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return;if(b.dataset.nav!=='inv'&&S.q){S.q='';$('#q').value='';$('#sbox').classList.remove('has')}go(b.dataset.nav)});
const qIn=$('#q');
qIn.addEventListener('input',()=>{S.q=qIn.value;$('#sbox').classList.toggle('has',!!S.q);if(S.view!=='inv'){S.view='inv';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav==='inv'))}subbar();renderInv()});
qIn.addEventListener('keydown',e=>{if(e.key==='Enter')qIn.blur();if(e.key==='Escape'){qIn.value='';qIn.dispatchEvent(new Event('input'))}});
$('#qclr').addEventListener('click',()=>{qIn.value='';qIn.dispatchEvent(new Event('input'));qIn.focus()});
$('#subbar').addEventListener('click',e=>{
  const t=e.target.closest('[data-nivel]');if(t){S.nivel=t.dataset.nivel;lsSet('ci_ui',{nivel:S.nivel});subbar();renderInv();return}
  const f=e.target.closest('[data-filtro]');if(f){S.filtro=f.dataset.filtro;subbar();renderInv()}
});
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');
  if(st){const inp=document.getElementById(st.dataset.step);inp.value=fmt(Math.max(0,(parseFloat(inp.value)||0)+(+st.dataset.d)));return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,row=a.closest('.it'),id=row&&row.dataset.id;
  switch(act){
    case 'dec':bump(id,-1);break;
    case 'inc':bump(id,1);break;
    case 'edit':editSheet(id);break;
    case 'comprado':compradoSheet(id);break;
    case 'toggle':{const k=a.closest('.cont').dataset.cid;S.col[k]=!S.col[k];lsSet('ci_col',S.col);a.closest('.cont').classList.toggle('col');break}
    case 'addin':{const c=S.conts.find(x=>x.id===a.closest('.cont').dataset.cid);S.alta=null;altaDefaults({nivel:c.nivel,contenedor:c.nombre});go('alta');setTimeout(()=>$('#a_nombre').focus(),40);break}
    case 'altaq':{const n=S.q.trim();S.q='';qIn.value='';$('#sbox').classList.remove('has');S.alta=null;altaDefaults({nombre:n});go('alta');break}
    case 'altasave':doAlta(false);break;
    case 'altamore':doAlta(true);break;
    case 'newcont':contEditor(null,S.nivel);break;
    case 'cnew':contEditor(null,a.dataset.nivel);break;
    case 'cedit':contEditor(a.dataset.cid);break;
    case 'exp':exportJSON();break;
    case 'install':instalar();break;
    case 'checkupd':checkUpdate();break;
    case 'imp':$('#fileIn').click();break;
    case 'reset':confirmSheet('Restaurar inventario inicial','Se borrarán todos tus cambios y movimientos. Te recomiendo descargar un respaldo antes.','Borrar y restaurar',async()=>{await seedAll();toast('Inventario inicial restaurado');render()});break;
    case 'wa':window.open('https://wa.me/?text='+encodeURIComponent(listaTexto()),'_blank');break;
    case 'share':if(navigator.share)navigator.share({title:'Lista de compras',text:listaTexto()}).catch(()=>{});else{copyText(listaTexto())}break;
    case 'copy':copyText(listaTexto());break;
    case 'txt':download('lista_compras_closet.txt',listaTexto(),'text/plain');break;
  }
});
function copyText(t){const ok=()=>toast('Lista copiada al portapapeles');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('No se pudo copiar',null,'ba')}ta.remove()}
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value=''});

/* ---------- PWA: instalación, actualización, estado de red ---------- */
const APP_VERSION='2.0.0';
let deferredInstall=null,swReg=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isHttp=/^https?:$/.test(location.protocol);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#instBtn').classList.remove('hide');if(S.view==='mas')renderMas()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;$('#instBtn').classList.add('hide');toast('App instalada en tu pantalla de inicio ✔');if(S.view==='mas')renderMas()});
async function instalar(){
  if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;$('#instBtn').classList.add('hide');return}
  openSheet(`<h3>📲 Instalar en tu teléfono</h3>${howTo()}<button class="btn" onclick="closeSheet()">Entendido</button>`);
}
function howTo(){
  if(isIOS)return '<ol class="how"><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (cuadro con flecha ↑).</li><li>Elige <b>Agregar a pantalla de inicio</b> → <b>Agregar</b>.</li></ol>';
  return '<ol class="how"><li>Abre esta página en <b>Chrome</b>.</li><li>Toca el menú <b>⋮</b> (arriba a la derecha).</li><li>Elige <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</li></ol>';
}
function appCard(){
  const ctrl='serviceWorker' in navigator&&!!navigator.serviceWorker.controller;
  let st;
  if(!isHttp)st='<p class="wa-line">Estás usando la versión de archivo. Para instalarla como app ábrela desde su dirección web.</p>';
  else if(isStandalone())st='<p class="ok-line">✔ Instalada y abierta como app</p>';
  else if(deferredInstall)st='<p>Instálala para abrirla desde tu pantalla de inicio, a pantalla completa.</p><button class="btn pr" data-act="install">Instalar app</button>';
  else st='<p>Para tenerla en tu pantalla de inicio:</p>'+howTo();
  return `<div class="card"><h2>📲 App</h2>${st}<p style="margin-top:10px">${ctrl?'<span class="ok-line">✔ Lista para usarse sin internet</span>':isHttp?'Preparando modo sin internet… (recarga una vez)':'Modo sin internet: disponible al abrirla desde la web'} · versión ${APP_VERSION}</p>${isHttp?'<button class="btn" data-act="checkupd">Buscar actualización</button>':''}</div>`;
}
function netUI(){$('#net').classList.toggle('hide',navigator.onLine)}
addEventListener('online',()=>{netUI();toast('Conexión recuperada')});addEventListener('offline',()=>{netUI();toast('Sin conexión: la app sigue funcionando normal',null,'wa')});
function showUpdate(w){$('#upd').classList.add('show');$('#updBtn').onclick=()=>{$('#upd').classList.remove('show');w.postMessage('skipWaiting')}}
async function checkUpdate(){if(!swReg){toast('El modo app aún no está activo',null,'wa');return}if(!navigator.onLine){toast('Necesitas internet para buscar actualizaciones',null,'wa');return}
  try{await swReg.update();if(swReg.waiting||swReg.installing)toast('Descargando versión nueva…');else toast('Ya tienes la versión más reciente ✔')}catch(e){toast('No se pudo revisar: '+e.message,null,'ba')}}
if('serviceWorker' in navigator&&isHttp){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloaded)return;reloaded=true;location.reload()});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate(w);if(w.state==='activated'&&S.view==='mas')renderMas()})});
    setInterval(()=>{if(navigator.onLine)reg.update().catch(()=>{})},3600e3);
  }).catch(e=>console.warn('SW no registrado:',e))});
}
function openFromURL(){
  const v=new URLSearchParams(location.search).get('v');
  if(v==='rep'||v==='alta'||v==='mas')go(v);
  if(v==='buscar')setTimeout(()=>qIn.focus(),100);
  if(location.search){try{history.replaceState(null,'',location.pathname)}catch(e){}}
}

/* ---------- Arranque ---------- */
load().then(()=>{render();netUI();openFromURL()}).catch(err=>{$('#view').innerHTML=`<div class="card"><h2>Error al iniciar</h2><p>${esc(err&&err.message||err)}</p></div>`});
</script>
</body>
